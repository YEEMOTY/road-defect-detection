<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101215">
<title>道路缺陷与障碍物检测</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4b63f'/%3E%3Cpath d='M11 24 14 8M21 24 18 8M16 21v-3' stroke='%23101215' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#101215;
    --panel:#191d23;
    --panel-2:#1e232a;
    --line:#2b3039;
    --line-soft:#232830;
    --text:#eceef1;
    --muted:#8b939e;
    --dim:#5d6570;
    --accent:#f4b63f;
    --accent-2:#ffd27a;
    --good:#57d49b;
    --bad:#ff7066;
    --radius:14px;
    --font-body:"HarmonyOS Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    --font-tech:"Bahnschrift","DIN Alternate","Consolas",monospace;
  }

  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.6;
    background:
      radial-gradient(900px 520px at 88% -12%, rgba(244,182,63,.13), transparent 62%),
      radial-gradient(680px 420px at -5% 105%, rgba(87,212,155,.06), transparent 60%),
      var(--bg);
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%, #000 25%, transparent 78%);
    mask-image:radial-gradient(circle at 50% 0%, #000 25%, transparent 78%);
  }

  .shell{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 64px;
  }

  /* ---------- 顶部 ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px 0 18px;
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .brand-mark{
    flex:0 0 auto;
    width:44px;height:44px;
    display:grid;place-items:center;
    border:1px solid rgba(244,182,63,.5);
    border-radius:12px;
    background:linear-gradient(160deg, rgba(244,182,63,.16), rgba(244,182,63,.03));
    box-shadow:inset 0 0 22px rgba(244,182,63,.08);
  }
  .brand h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .brand-sub{
    margin:2px 0 0;
    font-family:var(--font-tech);
    font-size:10px;
    letter-spacing:.26em;
    color:var(--dim);
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .server-chip{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-tech);
    font-size:11px;
    letter-spacing:.12em;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    background:rgba(255,255,255,.02);
  }
  .server-chip .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--dim);
    box-shadow:0 0 0 3px rgba(93,101,112,.15);
  }
  .server-chip[data-state="online"]{color:var(--good);border-color:rgba(87,212,155,.35)}
  .server-chip[data-state="online"] .dot{background:var(--good);box-shadow:0 0 0 3px rgba(87,212,155,.16)}
  .server-chip[data-state="offline"]{color:var(--bad);border-color:rgba(255,112,102,.35)}
  .server-chip[data-state="offline"] .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(255,112,102,.16)}

  /* ---------- 布局 ---------- */
  .layout{
    display:grid;
    grid-template-columns:minmax(320px, 372px) minmax(0, 1fr);
    gap:20px;
    align-items:start;
    padding-top:26px;
  }

  .panel{
    position:relative;
    background:linear-gradient(180deg, var(--panel) 0%, #171a1f 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:0 18px 42px rgba(0,0,0,.28);
    animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  .panel + .panel{animation-delay:.08s}
  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  .panel-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .panel-head .no{
    font-family:var(--font-tech);
    font-size:11px;
    letter-spacing:.1em;
    color:var(--accent);
    border:1px solid rgba(244,182,63,.32);
    border-radius:6px;
    padding:2px 7px;
    background:rgba(244,182,63,.07);
  }
  .panel-head h2{
    margin:0;
    font-size:15px;
    font-weight:700;
    letter-spacing:.08em;
  }

  /* ---------- 上传 ---------- */
  .dropzone{
    display:block;
    border:1px dashed #3a414b;
    border-radius:12px;
    background:rgba(255,255,255,.015);
    padding:26px 18px;
    min-height:196px;
    display:grid;
    place-items:center;
    text-align:center;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease, transform .2s ease;
    outline:none;
  }
  .dropzone:hover,.dropzone:focus-visible{
    border-color:rgba(244,182,63,.6);
    background:rgba(244,182,63,.045);
  }
  .dropzone.dragging{
    border-color:var(--accent);
    background:rgba(244,182,63,.09);
    transform:scale(.995);
  }
  .dropzone.has-file{
    padding:12px;
    border-style:solid;
    border-color:#343a44;
    cursor:pointer;
  }
  .dropzone-empty{display:flex;flex-direction:column;align-items:center;gap:10px}
  .dropzone-empty svg{opacity:.75}
  .dz-title{margin:0;font-size:14px;font-weight:600;color:#d7dbe0}
  .dz-hint{margin:0;font-size:12px;color:var(--dim);line-height:1.7}

  .dropzone-preview{width:100%;display:flex;flex-direction:column;gap:8px}
  .dropzone-preview img{
    width:100%;
    max-height:230px;
    object-fit:contain;
    border-radius:8px;
    background:#0c0e11;
    display:block;
  }
  .file-meta{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-family:var(--font-tech);
    font-size:11px;
    color:var(--muted);
    letter-spacing:.04em;
  }
  .file-meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
  button{
    font-family:inherit;
    font-size:14px;
    border-radius:10px;
    border:1px solid transparent;
    height:44px;
    padding:0 18px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
  }
  button:active:not(:disabled){transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{
    background:linear-gradient(180deg, var(--accent-2), var(--accent));
    color:#191307;
    font-weight:700;
    letter-spacing:.06em;
    box-shadow:0 8px 22px rgba(244,182,63,.18);
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.06)}
  .btn-primary:disabled{
    background:#2a2f36;
    color:#5f6772;
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border-color:var(--line);
    padding:0 14px;
  }
  .btn-ghost:hover:not(:disabled){color:var(--text);border-color:#3d444f}
  .btn-ghost:disabled{opacity:.45;cursor:not-allowed}

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    font-size:12.5px;
    color:var(--muted);
    min-height:20px;
  }
  .status::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--dim);
    flex:0 0 auto;
  }
  .status[data-state="ok"]{color:var(--good)}
  .status[data-state="ok"]::before{background:var(--good)}
  .status[data-state="error"]{color:var(--bad)}
  .status[data-state="error"]::before{background:var(--bad)}
  .status[data-state="busy"]{color:var(--accent)}
  .status[data-state="busy"]::before{background:var(--accent);animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}

  .tips{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line-soft);
    font-size:12px;
    color:var(--dim);
    line-height:1.75;
  }
  .tips strong{
    display:inline-block;
    font-family:var(--font-tech);
    font-size:10px;
    letter-spacing:.16em;
    color:var(--accent);
    margin-right:6px;
  }

  /* ---------- 结果 ---------- */
  .result-panel{display:flex;flex-direction:column;min-height:480px}
  .metrics{margin-left:auto;display:flex;gap:22px}
  .metric{text-align:right}
  .metric-value{
    display:block;
    font-family:var(--font-tech);
    font-size:23px;
    line-height:1.1;
    color:var(--accent);
    letter-spacing:.02em;
  }
  .metric-label{
    display:block;
    margin-top:2px;
    font-size:10px;
    letter-spacing:.14em;
    color:var(--dim);
  }

  .stage{
    flex:1;
    position:relative;
    display:grid;
    place-items:center;
    min-height:300px;
    padding:14px;
    border:1px solid var(--line-soft);
    border-radius:12px;
    background:
      linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px),
      #14171b;
    background-size:26px 26px, 26px 26px, auto;
    overflow:hidden;
  }

  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    padding:36px 20px;
  }
  .empty-state svg{opacity:.55}
  .empty-title{margin:0;font-size:14px;color:var(--muted);letter-spacing:.04em}
  .empty-hint{margin:0;font-size:12px;color:var(--dim)}

  .compare{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    align-items:start;
  }
  .compare figure{margin:0;min-width:0}
  .compare figcaption{
    font-family:var(--font-tech);
    font-size:10px;
    letter-spacing:.16em;
    color:var(--dim);
    margin-bottom:7px;
    text-transform:uppercase;
  }
  .compare img{
    display:block;
    width:100%;
    max-height:340px;
    object-fit:contain;
    border:1px solid var(--line);
    border-radius:8px;
    background:#0b0d10;
  }
  .compare figure:last-child img{border-color:rgba(244,182,63,.34)}

  .scanning{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    width:100%;
  }
  .scan-frame{
    position:relative;
    width:min(430px, 92%);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:#0b0d10;
  }
  .scan-frame img{display:block;width:100%;max-height:260px;object-fit:contain;opacity:.88}
  .scan-line{
    position:absolute;
    left:0;right:0;top:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow:0 0 16px rgba(244,182,63,.85);
    animation:scan 1.7s ease-in-out infinite alternate;
  }
  @keyframes scan{
    from{transform:translateY(0);opacity:.55}
    to{transform:translateY(258px);opacity:1}
  }
  .scanning p{
    margin:0;
    font-family:var(--font-tech);
    font-size:11px;
    letter-spacing:.2em;
    color:var(--accent);
  }

  .counts{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line-soft);
  }
  .counts-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .counts-head h3{margin:0;font-size:13px;letter-spacing:.1em;font-weight:700}
  .counts-head span{font-family:var(--font-tech);font-size:11px;color:var(--dim);letter-spacing:.06em}
  .count-list{list-style:none;margin:12px 0 0;padding:0}
  .count-list li{
    display:grid;
    grid-template-columns:30px minmax(88px, 1.1fr) minmax(90px, 2fr) 44px;
    align-items:center;
    gap:10px;
    padding:7px 0;
  }
  .count-list .rank{
    font-family:var(--font-tech);
    font-size:11px;
    color:var(--dim);
    letter-spacing:.08em;
  }
  .count-list .cls{
    font-size:13px;
    color:#dce0e5;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .count-list .bar{
    height:6px;
    border-radius:3px;
    background:#262b33;
    overflow:hidden;
  }
  .count-list .bar i{
    display:block;
    height:100%;
    border-radius:3px;
    background:linear-gradient(90deg, rgba(244,182,63,.55), var(--accent));
  }
  .count-list .num{
    font-family:var(--font-tech);
    font-size:15px;
    color:var(--accent);
    text-align:right;
  }
  .no-target{
    display:block !important;
    font-size:13px;
    color:var(--muted);
    padding:6px 0;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 960px){
    .layout{grid-template-columns:1fr;gap:16px;padding-top:20px}
    .result-panel{min-height:0}
    .result-panel .panel-head{gap:8px}
    .metrics{gap:16px}
    .metric-value{font-size:20px}
  }
  @media (max-width: 640px){
    .shell{padding:0 14px 44px}
    .topbar{padding:16px 0 14px}
    .brand h1{font-size:16px}
    .brand-sub{font-size:9px;letter-spacing:.16em}
    .brand-mark{width:38px;height:38px}
    .server-chip{padding:6px 10px;font-size:10px;letter-spacing:.06em}
    .panel{padding:16px;border-radius:12px}
    .compare{grid-template-columns:1fr}
    .compare img{max-height:300px}
    .stage{padding:10px;min-height:260px}
    .dropzone{min-height:170px}
    .actions{grid-template-columns:1fr 1fr}
    .count-list li{grid-template-columns:24px minmax(70px, 1fr) minmax(60px, 1.6fr) 36px;gap:8px}
    .metrics{width:100%;margin-left:0;justify-content:flex-start}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M7.5 20 10 4M16.5 20 14 4M12 17v-2.2M12 11.5V9.3" stroke="#f4b63f" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>道路缺陷与障碍物检测</h1>
        <p class="brand-sub">Road Defect &amp; Obstacle Inspection</p>
      </div>
    </div>
    <div class="server-chip" id="serverChip" data-state="checking">
      <span class="dot"></span>
      <span id="serverText">服务连接中</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel upload-panel" aria-labelledby="uploadTitle">
      <div class="panel-head">
        <span class="no">01</span>
        <h2 id="uploadTitle">上传图片</h2>
      </div>

      <label class="dropzone" id="dropzone" tabindex="0" for="fileInput">
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp,.webp" hidden>
        <div class="dropzone-empty" id="dropzoneEmpty">
          <svg width="42" height="42" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect x="6" y="10" width="36" height="28" rx="4" stroke="#5d6570" stroke-width="2"/>
            <path d="M6 32l10-9 7 6 8-7 11 10" stroke="#5d6570" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="18" cy="19" r="2.6" fill="#5d6570"/>
          </svg>
          <p class="dz-title">点击选择 / 拖拽到此处</p>
          <p class="dz-hint">支持 JPG · PNG · BMP · WEBP<br>单张不超过 16MB</p>
        </div>
        <div class="dropzone-preview" id="dropzonePreview" hidden>
          <img id="previewImg" alt="待检测图片预览">
          <div class="file-meta">
            <span id="fileName">—</span>
            <span id="fileSize">—</span>
          </div>
        </div>
      </label>

      <div class="actions">
        <button type="button" class="btn-primary" id="detectBtn" disabled>开始检测</button>
        <button type="button" class="btn-ghost" id="resetBtn" disabled>重选</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite" data-state="idle">等待选择图片</div>

      <div class="tips">
        <strong>NOTE</strong>推理在本机完成，图片仅用于本次检测。服务同时只处理一张图片，多人使用时会自动排队。
      </div>
    </section>

    <section class="panel result-panel" id="resultPanel" aria-labelledby="resultTitle">
      <div class="panel-head">
        <span class="no">02</span>
        <h2 id="resultTitle">检测结果</h2>
        <div class="metrics" id="metrics" hidden>
          <div class="metric">
            <span class="metric-value" id="metricTotal">0</span>
            <span class="metric-label">目标总数</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="metricTime">0</span>
            <span class="metric-label">耗时 / ms</span>
          </div>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="empty-state" id="emptyState">
          <svg width="58" height="58" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="8" y="14" width="48" height="36" rx="5" stroke="#3b444f" stroke-width="2"/>
            <path d="M8 42l13-12 9 8 10-9 16 14" stroke="#3b444f" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="23" cy="25" r="3.4" fill="#3b444f"/>
          </svg>
          <p class="empty-title" id="emptyTitle">尚未进行检测</p>
          <p class="empty-hint" id="emptyHint">选择一张路面图片，点击“开始检测”</p>
        </div>

        <div class="scanning" id="scanning" hidden>
          <div class="scan-frame">
            <img id="scanImg" alt="">
            <span class="scan-line"></span>
          </div>
          <p>正在推理，请稍候…</p>
        </div>

        <div class="compare" id="compare" hidden>
          <figure>
            <figcaption>原图 / Original</figcaption>
            <img id="origImg" alt="原始图片">
          </figure>
          <figure>
            <figcaption>检测结果 / Detected</figcaption>
            <img id="resultImg" alt="检测结果图">
          </figure>
        </div>
      </div>

      <div class="counts" id="counts" hidden>
        <div class="counts-head">
          <h3>目标统计</h3>
          <span id="countsSub"></span>
        </div>
        <ul class="count-list" id="countList"></ul>
      </div>
    </section>
  </main>
</div>

<noscript>
  <p style="text-align:center;color:#ff7066;padding:24px">需要启用 JavaScript 才能使用图片检测功能。</p>
</noscript>

<script>
(function () {
  "use strict";

  var MAX_MB = 16;
  var ALLOWED = ["jpg", "jpeg", "png", "bmp", "webp"];

  var $ = function (id) { return document.getElementById(id); };
  var dropzone = $("dropzone");
  var fileInput = $("fileInput");
  var dropzoneEmpty = $("dropzoneEmpty");
  var dropzonePreview = $("dropzonePreview");
  var previewImg = $("previewImg");
  var fileNameEl = $("fileName");
  var fileSizeEl = $("fileSize");
  var detectBtn = $("detectBtn");
  var resetBtn = $("resetBtn");
  var statusEl = $("status");
  var emptyState = $("emptyState");
  var emptyTitle = $("emptyTitle");
  var emptyHint = $("emptyHint");
  var scanning = $("scanning");
  var scanImg = $("scanImg");
  var compare = $("compare");
  var origImg = $("origImg");
  var resultImg = $("resultImg");
  var metrics = $("metrics");
  var metricTotal = $("metricTotal");
  var metricTime = $("metricTime");
  var counts = $("counts");
  var countsSub = $("countsSub");
  var countList = $("countList");
  var resultPanel = $("resultPanel");

  var currentFile = null;
  var previewURL = null;
  var busy = false;

  function setStatus(text, state) {
    statusEl.textContent = text;
    statusEl.setAttribute("data-state", state || "idle");
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(2) + " MB";
  }

  function getExt(name) {
    var idx = name.lastIndexOf(".");
    return idx > -1 ? name.slice(idx + 1).toLowerCase() : "";
  }

  function showEmpty(title, hint) {
    emptyTitle.textContent = title || "尚未进行检测";
    emptyHint.textContent = hint || "选择一张路面图片，点击“开始检测”";
    emptyState.hidden = false;
  }

  function clearResults() {
    compare.hidden = true;
    scanning.hidden = true;
    metrics.hidden = true;
    counts.hidden = true;
    countList.innerHTML = "";
    origImg.removeAttribute("src");
    resultImg.removeAttribute("src");
    scanImg.removeAttribute("src");
  }

  function resetAll() {
    if (busy) return;
    if (previewURL) {
      URL.revokeObjectURL(previewURL);
      previewURL = null;
    }
    currentFile = null;
    fileInput.value = "";
    previewImg.removeAttribute("src");
    dropzonePreview.hidden = true;
    dropzoneEmpty.hidden = false;
    dropzone.classList.remove("has-file");
    detectBtn.disabled = true;
    resetBtn.disabled = true;
    detectBtn.textContent = "开始检测";
    clearResults();
    showEmpty();
    setStatus("等待选择图片", "idle");
  }

  function selectFile(file) {
    if (busy || !file) return;

    var ext = getExt(file.name);
    if (ALLOWED.indexOf(ext) === -1) {
      setStatus("不支持的图片格式：" + (ext || "未知") + "，请选择 JPG / PNG / BMP / WEBP", "error");
      fileInput.value = "";
      return;
    }
    if (file.size > MAX_MB * 1024 * 1024) {
      setStatus("图片超过 " + MAX_MB + "MB 限制，请压缩后再上传", "error");
      fileInput.value = "";
      return;
    }

    if (previewURL) URL.revokeObjectURL(previewURL);
    currentFile = file;
    previewURL = URL.createObjectURL(file);
    previewImg.src = previewURL;
    fileNameEl.textContent = file.name;
    fileSizeEl.textContent = formatSize(file.size);

    dropzoneEmpty.hidden = true;
    dropzonePreview.hidden = false;
    dropzone.classList.add("has-file");
    detectBtn.disabled = false;
    resetBtn.disabled = false;
    detectBtn.textContent = "开始检测";

    clearResults();
    showEmpty();
    dropzone.classList.remove("dragging");
    setStatus("已选择图片，点击“开始检测”", "ok");
  }

  function renderResults(data) {
    var summary = data.summary || { total: 0, counts: {} };
    var total = summary.total || 0;

    metricTotal.textContent = total;
    metricTime.textContent = data.elapsed_ms || 0;
    origImg.src = data.original_url || previewURL || "";
    resultImg.src = data.image_url || "";

    var entries = Object.keys(summary.counts || {}).map(function (key) {
      return [key, summary.counts[key]];
    }).sort(function (a, b) { return b[1] - a[1]; });

    countList.innerHTML = "";
    if (entries.length === 0) {
      countsSub.textContent = "未发现目标";
      var li = document.createElement("li");
      li.className = "no-target";
      li.textContent = "未检测到缺陷或障碍物，可尝试换一张更清晰的路面图片。";
      countList.appendChild(li);
    } else {
      var max = entries[0][1] || 1;
      countsSub.textContent = entries.length + " 类 · 共 " + total + " 个目标";
      entries.forEach(function (entry, i) {
        var li = document.createElement("li");

        var rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = ("0" + (i + 1)).slice(-2);

        var cls = document.createElement("span");
        cls.className = "cls";
        cls.textContent = entry[0];
        cls.title = entry[0];

        var bar = document.createElement("span");
        bar.className = "bar";
        var fill = document.createElement("i");
        fill.style.width = Math.max(6, Math.round(entry[1] / max * 100)) + "%";
        bar.appendChild(fill);

        var num = document.createElement("b");
        num.className = "num";
        num.textContent = entry[1];

        li.appendChild(rank);
        li.appendChild(cls);
        li.appendChild(bar);
        li.appendChild(num);
        countList.appendChild(li);
      });
    }

    compare.hidden = false;
    scanning.hidden = true;
    metrics.hidden = false;
    counts.hidden = false;
    emptyState.hidden = true;

    setStatus("检测完成，用时 " + (data.elapsed_ms || 0) + " ms", "ok");

    if (window.matchMedia("(max-width: 960px)").matches) {
      resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  async function runDetect() {
    if (busy || !currentFile) return;

    busy = true;
    detectBtn.disabled = true;
    resetBtn.disabled = true;
    detectBtn.textContent = "检测中…";
    setStatus("正在上传并推理，请稍候…", "busy");

    emptyState.hidden = true;
    compare.hidden = true;
    metrics.hidden = true;
    counts.hidden = true;
    scanImg.src = previewURL || "";
    scanning.hidden = false;

    var form = new FormData();
    form.append("image", currentFile);

    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 180000);

    try {
      var resp = await fetch("/predict", {
        method: "POST",
        body: form,
        signal: controller.signal,
        cache: "no-store"
      });
      var payload = await resp.json().catch(function () { return {}; });
      if (!resp.ok || payload.code !== 200) {
        throw new Error(payload.msg || ("接口返回异常（HTTP " + resp.status + "）"));
      }
      renderResults(payload.data || {});
    } catch (err) {
      scanning.hidden = true;
      showEmpty("检测失败", err && err.name === "AbortError"
        ? "请求超时，请检查网络或稍后重试"
        : "请检查后端服务是否正常，然后重试");
      setStatus(err && err.name === "AbortError"
        ? "请求超时，请稍后重试"
        : "检测失败：" + (err.message || "未知错误"), "error");
      if (window.matchMedia("(max-width: 960px)").matches) {
        resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    } finally {
      clearTimeout(timer);
      busy = false;
      detectBtn.disabled = !currentFile;
      resetBtn.disabled = !currentFile;
      detectBtn.textContent = "开始检测";
    }
  }

  /* ---------- 事件绑定 ---------- */
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) selectFile(fileInput.files[0]);
  });

  detectBtn.addEventListener("click", runDetect);
  resetBtn.addEventListener("click", resetAll);

  ["dragenter", "dragover"].forEach(function (name) {
    dropzone.addEventListener(name, function (e) {
      e.preventDefault();
      if (!busy) dropzone.classList.add("dragging");
    });
  });
  ["dragleave", "dragend"].forEach(function (name) {
    dropzone.addEventListener(name, function () {
      dropzone.classList.remove("dragging");
    });
  });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("dragging");
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) selectFile(file);
  });
  dropzone.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      fileInput.click();
    }
  });
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) { e.preventDefault(); });

  /* ---------- 服务状态 ---------- */
  function markServer(online) {
    var chip = $("serverChip");
    chip.setAttribute("data-state", online ? "online" : "offline");
    $("serverText").textContent = online ? "服务在线" : "服务未连接";
  }

  fetch("/health", { cache: "no-store" })
    .then(function (resp) {
      if (!resp.ok) throw new Error("bad status");
      return resp.json();
    })
    .then(function (data) {
      markServer(data.code === 200);
    })
    .catch(function () { markServer(false); });
})();
</script>
</body>
</html>
